name: One-shot normalize ActionModel column ids

on:
  push:
    branches:
      - fix/docker-registry-auth-fallback
    paths:
      - .github/workflows/one-shot-normalize-action-model.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/docker-registry-auth-fallback

      - name: Update duplicated-action destination column ids
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/units/Model/ActionModelTest.php')
          text = p.read_text()
          replacements = {
              "array('column_id' => 5, 'color_id' => 'red')": "array('column_id' => 7, 'color_id' => 'red')",
              "array('src_column_id' => 5, 'dst_column_id' => 6, 'dest_column_id' => 7)": "array('src_column_id' => 7, 'dst_column_id' => 8, 'dest_column_id' => 9)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected anchor missing: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Commit normalized expectations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/units/Model/ActionModelTest.php
          git diff --cached --quiet && exit 0
          git commit -m "test: align duplicated action columns with six-stage board"
          git push origin HEAD:fix/docker-registry-auth-fallback
