name: One-shot normalize board formatter tests

on:
  push:
    branches:
      - fix/docker-registry-auth-fallback
    paths:
      - .github/workflows/one-shot-normalize-board-formatter.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/docker-registry-auth-fallback

      - name: Update six-stage board expectations without reducing coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/units/Formatter/BoardFormatterTest.php')
          text = p.read_text()
          text = text.replace("assertCount(4, $board[0]['columns'])", "assertCount(6, $board[0]['columns'])")
          text = text.replace("assertCount(4, $board[1]['columns'])", "assertCount(6, $board[1]['columns'])")
          text = text.replace("assertCount(4, $board[2]['columns'])", "assertCount(6, $board[2]['columns'])")
          text = text.replace("assertEquals(4, $board[0]['nb_columns'])", "assertEquals(6, $board[0]['nb_columns'])")
          text = text.replace("assertEquals(4, $board[1]['nb_columns'])", "assertEquals(6, $board[1]['nb_columns'])")
          text = text.replace("assertEquals(4, $board[2]['nb_columns'])", "assertEquals(6, $board[2]['nb_columns'])")
          needle = "        $this->assertTrue($columnModel->remove(4));\n"
          replacement = needle + "        $this->assertTrue($columnModel->remove(5));\n        $this->assertTrue($columnModel->remove(6));\n"
          if needle not in text:
              raise SystemExit('expected remove(4) anchor not found')
          text = text.replace(needle, replacement, 1)
          p.write_text(text)
          PY

      - name: Verify only intended legacy expectations were removed
        run: |
          ! grep -F "assertCount(4, \$board" tests/units/Formatter/BoardFormatterTest.php
          ! grep -F "assertEquals(4, \$board" tests/units/Formatter/BoardFormatterTest.php
          grep -F "remove(5)" tests/units/Formatter/BoardFormatterTest.php
          grep -F "remove(6)" tests/units/Formatter/BoardFormatterTest.php

      - name: Commit normalized expectations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/units/Formatter/BoardFormatterTest.php
          git diff --cached --quiet && exit 0
          git commit -m "test: align board formatter with six-stage default board"
          git push origin HEAD:fix/docker-registry-auth-fallback
