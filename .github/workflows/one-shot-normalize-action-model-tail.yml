name: One-shot normalize remaining ActionModel ids

on:
  push:
    branches:
      - fix/docker-registry-auth-fallback
    paths:
      - .github/workflows/one-shot-normalize-action-model-tail.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/docker-registry-auth-fallback

      - name: Update remaining duplicated-action destination ids
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/units/Model/ActionModelTest.php')
          text = p.read_text()
          replacements = {
              "array('column_id' => 5, 'project_id' => 3)": "array('column_id' => 7, 'project_id' => 3)",
              "array('column_id' => 5, 'user_id' => 2)": "array('column_id' => 7, 'user_id' => 2)",
              "array('column_id' => 5, 'category_id' => 2)": "array('column_id' => 7, 'category_id' => 2)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected anchor missing: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Commit normalized expectations
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/units/Model/ActionModelTest.php
          git diff --cached --quiet && exit 0
          git commit -m "test: align remaining action duplication ids"
          git push origin HEAD:fix/docker-registry-auth-fallback
